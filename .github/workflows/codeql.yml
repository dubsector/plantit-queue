name: CodeQL

on:
  push:
    branches: [master]
    paths:
      - 'src/**'
      - 'pom.xml'
      - '.github/workflows/codeql.yml'
  pull_request:
  schedule:
    - cron: '0 3 * * 1'  # weekly Monday 03:00 UTC
  workflow_dispatch:

permissions: {}

jobs:
  analyze:
    name: Analyze (Java)
    runs-on: ubuntu-latest
    permissions:
      security-events: write
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up JDK 21
        uses: actions/setup-java@03ad4de0992f5dab5e18fcb136590ce7c4a0ac95 # v5.6.0
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Initialize CodeQL
        uses: github/codeql-action/init@7188fc363630916deb702c7fdcf4e481b751f97a # v4.37.1
        with:
          languages: java
          queries: security-and-quality

      - name: Install Plan dependency
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          PLAN_URL=$(curl -fsSL \
            -H "Authorization: Bearer $GH_TOKEN" \
            "https://api.github.com/repos/plan-player-analytics/Plan/releases/latest" \
            | python3 -c "import sys,json; assets=json.load(sys.stdin)['assets']; jar=next(a for a in assets if a['name'].startswith('Plan-') and a['name'].endswith('.jar')); print(jar['browser_download_url'])")
          echo "Downloading: $PLAN_URL"
          curl -fsSL "$PLAN_URL" -o Plan.jar
          ls -lh Plan.jar
          mvn install:install-file -Dfile=Plan.jar -DgroupId=com.djrapitops -DartifactId=plan -Dversion=5.7.3306 -Dpackaging=jar
          echo "Plan installed to local Maven cache"

      - name: Build
        run: mvn clean package -DskipTests -q

      - name: Perform CodeQL Analysis
        uses: github/codeql-action/analyze@7188fc363630916deb702c7fdcf4e481b751f97a # v4.37.1
        with:
          category: java
